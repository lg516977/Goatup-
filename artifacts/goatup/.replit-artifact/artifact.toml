kind = "web"
previewPath = "/"
title = "Goatup Chat"
version = "1.0.0"
id = "artifacts/goatup"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20227

[services.development]
run = "pnpm --filter @workspace/goatup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/goatup", "run", "build" ]
serve = "static"
publicDir = "artifacts/goatup/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20227"
BASE_PATH = "/"
